apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/<org>/eks-api.git"
    path: apps/argocd/environments/prod
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
