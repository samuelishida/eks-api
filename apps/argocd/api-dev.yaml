# api-dev — Application for the api chart in the api-dev namespace.
#
# Synced by ArgoCD (see argocd-project.yaml): the ALB Ingress this chart
# creates is reconciled by the AWS Load Balancer Controller (lbc.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-api
    app.kubernetes.io/env: dev
spec:
  project: eks-api
  source:
    repoURL: "https://github.com/<org>/eks-api.git"
    path: "charts/api"
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: api-dev
    createNamespace: true
  syncPolicy:
    autoSync:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
