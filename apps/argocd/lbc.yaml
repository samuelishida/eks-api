# AWS Load Balancer Controller — installed from the official upstream Helm
# chart.
#
# SYNC ORDER: this application must sync BEFORE the api-* applications,
# because the api chart's ALB Ingress is reconciled by the LBC.
#
# IRSA: the service account below is annotated with the Terraform-created
# IRSA role (one per environment: terraform/environments/<env>/lbc.tf).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lbc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-api
spec:
  project: eks-api
  source:
    repoURL: "https://github.com/kubernetes-sigs/aws-load-balancer-controller"
    path: "charts/aws-load-balancer-controller"
    targetRevision: "v3.6.0"
    helm:
      values: |
        serviceAccount:
          create: false
          name: aws-load-balancer-controller
          annotations:
            # PLACEHOLDER_ROLE_ARN — must match the Terraform output
            # `module.eks` env-level `lbc_role_arn`
            # (terraform/environments/<env>/lbc.tf, aws_iam_role.lbc.arn).
            # Replace before syncing to a real account.
            eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/eks-api-lbc-irsa"
        region: us-east-1
        ingressClass: alb
        clusterRole:
          create: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    autoSync:
      prune: true
      selfHeal: true
