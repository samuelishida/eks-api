name: deploy

# Dev promotion: when a build on main succeeds, open (or update) a PR that
# bumps charts/api/values-dev.yaml image.tag to the built SHA. The PR is the
# review gate; staging/prod are promoted the same way from separate PRs.
#
# No AWS credentials are needed here: the only side effects are a git push
# and a PR, both covered by GITHUB_TOKEN.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-dev-tag:
    # No-op (not an error) for any run that is not a successful build of main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # Serialize deploys: a newer run supersedes an in-flight one for the same SHA.
    concurrency:
      group: deploy-dev-bump
      cancel-in-progress: true
    steps:
      - name: Checkout the built SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Bump dev image tag and open/update PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_TITLE="chore(dev): bump api image to ${SHA}"
          BRANCH="chore/dev-bump-${SHA}"
          FILE=charts/api/values-dev.yaml

          # Idempotency: if a PR with this title already exists, update its
          # branch instead of opening a duplicate.
          EXISTING_PR_URL="$(gh pr list --state open --search "${PR_TITLE}" --json url --jq '.[0].url // empty')"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$EXISTING_PR_URL" ]]; then
            echo "PR already exists — updating branch: $EXISTING_PR_URL"
            git checkout -B "$BRANCH"
            # Rewrite image.tag to the new SHA (file may already carry an older SHA).
            sed -i -E "s|^([[:space:]]*tag:[[:space:]]*)\"?[0-9a-zA-Z._-]+\"?|\1\"${SHA}\"|" "$FILE"
            git add "$FILE"
            git commit -m "$PR_TITLE" --allow-empty
            git push origin "$BRANCH"
          else
            git checkout -B "$BRANCH"
            # Default tag is 'latest' (unquoted) in values.yaml; values-dev.yaml
            # inherits it, so add an explicit override line under image:.
            if grep -qE '^[[:space:]]*tag:' "$FILE"; then
              sed -i -E "s|^([[:space:]]*tag:[[:space:]]*)\"?[0-9a-zA-Z._-]+\"?|\1\"${SHA}\"|" "$FILE"
            else
              printf '\nimage:\n  tag: "%s"\n' "$SHA" >> "$FILE"
            fi
            git add "$FILE"
            git commit -m "$PR_TITLE"
            git push origin "$BRANCH"
            gh pr create --title "$PR_TITLE" --body "Auto-generated by the deploy workflow after a successful build of \`${SHA}\` on main. Bumps only \`charts/api/values-dev.yaml\`."
          fi
