name: deploy

# Dev promotion: a successful build on main opens a PR that bumps image.tag.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-dev-tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-bump
      cancel-in-progress: true
    steps:
      - name: Checkout the built SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Bump dev image tag and open/update PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_TITLE="chore(dev): bump api image to ${SHA}"
          BRANCH="chore/dev-bump-${SHA}"
          FILE=charts/api/values-dev.yaml
          EXISTING_PR_URL="$(gh pr list --state open --head "$BRANCH" --json url --jq '.[0].url // empty')"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reuse remote branch on retries; this avoids divergent empty commits.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi

          if grep -qE '^[[:space:]]*tag:' "$FILE"; then
            sed -i -E "s|^([[:space:]]*tag:[[:space:]]*)\"?[0-9a-zA-Z._-]+\"?|\\1\"${SHA}\"|" "$FILE"
          elif grep -qE '^image:[[:space:]]*$' "$FILE"; then
            sed -i "/^image:[[:space:]]*$/a\\  tag: \"${SHA}\"" "$FILE"
          else
            printf '\nimage:\n  tag: "%s"\n' "$SHA" >> "$FILE"
          fi
          git add "$FILE"

          if ! git diff --cached --quiet; then
            git commit -m "$PR_TITLE"
            git push origin "$BRANCH"
          fi

          if [[ -z "$EXISTING_PR_URL" ]]; then
            gh pr create \
              --title "$PR_TITLE" \
              --body "Auto-generated after a successful build of `${SHA}` on main. Bumps only `charts/api/values-dev.yaml`."
          fi
