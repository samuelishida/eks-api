name: provenance-gate

# Provenance gate: main may only advance via merged PRs.
#
# Mirrors the shared-cqrs-module pattern: a GitHub merge commit has exactly
# two parents (the previous main tip + the PR head), while a direct push to
# main produces a commit with a single parent. Checking the parent count is
# deterministic and needs no API access, so it is the primary gate.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail direct pushes to main
        run: |
          set -euo pipefail
          PARENTS="$(git log -1 --pretty=%P)"
          COUNT="$(echo "$PARENTS" | wc -w)"
          if [[ "$COUNT" -lt 2 ]]; then
            echo "::error::Commit ${{ github.sha }} was pushed directly to main (parent count: $COUNT). Only commits produced by merged PRs (merge commits with 2 parents) may land on main."
            exit 1
          fi
          echo "OK: ${{ github.sha }} is a merge commit (parents: $COUNT) — accepted."
